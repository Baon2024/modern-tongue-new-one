<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ModernTongue API</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #5B6FC0, #7B8FD8);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        margin: 0;
      }

      .card {
        background: rgba(15, 23, 42, 0.72);
        padding: 28px 32px;
        border-radius: 18px;
        max-width: 520px;
        text-align: center;
        box-shadow: 0 30px 60px rgba(15, 23, 42, 0.35);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        letter-spacing: 0.01em;
      }

      p {
        margin: 0 0 10px;
        line-height: 1.6;
        color: rgba(226, 232, 240, 0.9);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ModernTongue API</h1>
      <p>This Vercel deployment powers the free ModernTongue Chrome extension.</p>
      <p>POST requests to <code>/api/translate-free</code> will proxy the Helsinki-NLP/opus-mt-en-en model.</p>
    </div>
  </body>
</html>
